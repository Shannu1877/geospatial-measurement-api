version: "3.8"

services:
  geospatial-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geospatial-measurement-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Geospatial Measurement API
      - APP_VERSION=1.0.0
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/geospatial.db
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=50
      - MEASUREMENT_PRECISION=2
    volumes:
      - api-uploads:/app/uploads
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  api-uploads:
    driver: local
  api-data:
    driver: local
